# Publish the game on GitHub Pages.
#
# One-time setup in the repository's Settings → Pages: set "Source" to "GitHub Actions".
# After that, every push to main builds `dist/` and publishes it. The run's summary page
# shows the site URL.
#
# Nothing here uploads to a host or runs a server: Pages serves the static build, which is
# all this game needs — the art is bundled by Vite at build time and every sound effect is
# synthesised in the browser.
#
# One caveat about plans, not about the game: on a free account GitHub Pages serves only
# **public** repositories, and a private repository's Pages site is access-controlled — only
# people with repository access can load it. Pro makes publishing from a private repository
# work, but the link only reaches collaborators until the repository is made public. Either
# way this build job also uploads a `strata-site` zip under the run's Artifacts section,
# which Cloudflare Pages or Netlify can serve from a private repository for free.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The same checks the README promises: 200 generated levels solvable, the loot
      # simulation, the movement suite and the asset-name case audit — all in headless Node,
      # no display needed. A push that breaks generation never reaches the site.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # The same output as a downloadable zip, for any host you like better than Pages —
      # and the only route that works while the repository is private, since Pages cannot
      # serve from a private repository on a free plan.
      - uses: actions/upload-artifact@v4
        with:
          name: strata-site
          path: dist
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
